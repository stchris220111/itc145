<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bluetooth Technology</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/contactus.css">    
</head>

<body>
    <div class="page-container">
        <header class="site-header">
            <div class="branding">
                <img src="/images/bt_logo.jpg" alt="Bluetooth Logo" class="logo">
                <h1 class="site-title" aria-label="Bluetooth">
                    <span>B</span><span>l</span><span>u</span><span>e</span><span>t</span><span>o</span><span>o</span><span>t</span><span>h</span>
                </h1>
            </div>
            <nav id="horizontal">
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="menu-icon">&#9776;</label>
                <div class="nav-links">
                    <a href="history.html">History</a>
                    <a href="application.html">Application</a>
                    <a href="cost.html">Cost</a>
                    <a href="future.html">Future</a>
                    <a href="contactus.html">Contact Us</a>
                </div>
            </nav>
        </header>
        <main class="main-content">
   <form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="subject">Subject:</label>
    <select id="subject" name="subject">
        <option value="general">General Question</option>
        <option value="technical">Technical Question</option>
        <option value="feedback">Website Feedback</option>
    </select>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Submit</button>
    <button type="reset">Clear Form</button>
</form>   
        </main>
        <footer class="site-footer">
            <p>&copy; 2023 Bluetooth Technology. All rights reserved.</p>
        </footer>
    </div>
</body>
